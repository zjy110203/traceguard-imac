# PR Gate（三级门禁之一）：快速、确定性、可在 PR 内跑完。
# 职责：Ruff / 格式 / 单元 + 契约 / 关键服务集成（SSE、探针预算、Inbox 投影、稳定性回放、
#       Worker 队列沙箱、Run 隔离）/ 前端 typecheck + build。
# 不要求真实 API Key；不跑 Benchmark 与真实浏览器全量 E2E（Nightly / Release 负责）。
name: PR Gate

on:
  pull_request:
  push:
    # RUN-017 WP1：不再逐个轮次追加分支名（历史遗漏导致 RUN-016 从未触发门禁）。
    # GitHub 的 filter pattern 中 `*` 不匹配 `/`，`workbuddy/run*` 覆盖
    # workbuddy/run017-product-maturity 这类单层分支；`workbuddy/run*-*` 保留兼容。
    branches:
      - main
      - "workbuddy/run*"
      - "workbuddy/run*-*"
      - workbuddy/traceguard-autonomous

concurrency:
  group: pr-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m venv .venv
          # RUN-010 WP7：优先按 lock 安装（可复现），失败才回退范围声明
          .venv/bin/pip install -r requirements.lock.txt || \
            .venv/bin/pip install -r requirements-dev.txt
      - name: Ruff check
        run: .venv/bin/ruff check packages apps tests benchmark scripts
      - name: Ruff format check
        run: .venv/bin/ruff format --check packages apps tests benchmark scripts
      - name: Unit + Contract tests
        run: .venv/bin/pytest tests/unit tests/contracts -q
      - name: Fast service integration
        # 这些用例覆盖 SSE 续传、探针预算、时间线投影、稳定性回放、LLM 摘要、
        # 沙箱走 Worker 队列（无 Worker 时 fail-closed）与 Run 级状态隔离。
        # RUN-011-R1.2 关键安全专项（审核稳定性门禁绕过、全局观测越权）纳入 PR 快速门禁。
        # RUN-015 WP4：RUN-014 三个专项 + RUN-015 新增回归/fencing/SSE 专项纳入快速门禁。
        # PG16 长稳/锁等待不进 PR（耗时 + 依赖 Service Container），交给 Nightly。
        run: |
          .venv/bin/pytest -q \
            tests/integration/test_sse.py \
            tests/integration/test_probe_service.py \
            tests/integration/test_timeline_projection.py \
            tests/integration/test_stability_replay.py \
            tests/integration/test_llm_summary.py \
            tests/integration/test_sandbox_worker_queue.py \
            tests/integration/test_probe_budget_multiprocess.py \
            tests/integration/test_soak_run007_guards.py \
            tests/unit/test_pipeline_state_cache.py \
            tests/integration/test_review_gate_http_security_run011_r1_2.py \
            tests/integration/test_global_observation_rbac_run011_r1_2.py \
            tests/integration/test_repair_regression_run014.py \
            tests/integration/test_worker_fencing_run014.py \
            tests/integration/test_sse_revocation_and_global_rbac_run014.py \
            tests/integration/test_repair_regression_run015.py \
            tests/integration/test_worker_fencing_run015.py \
            tests/integration/test_sse_recheck_limit_run015.py \
            tests/integration/test_artifact_lifecycle_run016.py \
            tests/integration/test_promotion_recovery_run016.py \
            tests/integration/test_system_config_rbac_run016.py \
            tests/unit/test_benchmark_false_pass_v2_run016.py \
            tests/unit/test_benchmark_fault_effect_run016.py \
            tests/unit/test_fencing_entrypoint_audit_run016.py \
            tests/integration/test_regression_retry_run017.py
      - name: Gate result
        if: always()
        run: |
          echo "PR Gate backend: job status = ${{ job.status }}"

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        working-directory: apps/web
        run: npm ci
      - name: Typecheck + Build
        working-directory: apps/web
        run: npm run build
