# Nightly Gate（三级门禁之二）：真实依赖（PostgreSQL Service Container）+ 全量测试 + 安全专项。
# 关键失败（PostgreSQL / SSE / Inbox / Worker / 安全）必须阻断后续 Release。
# 真实 LLM 测试只在配置了仓库 Secret 时执行；未配置则显式记录 BLOCKED，不伪装通过。
name: Nightly Gate

on:
  schedule:
    - cron: "0 18 * * *" # UTC 18:00 = 北京时间次日 02:00
  workflow_dispatch:

concurrency:
  group: nightly-gate
  cancel-in-progress: false

jobs:
  backend-full:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements-dev.txt
          .venv/bin/python -m playwright install --with-deps chromium || true
      - name: Full backend suite (SQLite)
        run: .venv/bin/pytest -q
      - name: Worker / event / inbox concurrency (real processes)
        run: |
          .venv/bin/pytest -q \
            tests/unit/test_event_concurrency.py \
            tests/unit/test_inbox_persistence.py \
            tests/unit/test_probe_budget.py
      - name: Upload pytest artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-pytest
          path: |
            .pytest-tmp
            logs
          retention-days: 7

  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: traceguard
          POSTGRES_PASSWORD: traceguard_ci_only
          POSTGRES_DB: traceguard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U traceguard"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TG_TEST_POSTGRES_URL: postgresql+psycopg://traceguard:traceguard_ci_only@127.0.0.1:5432/traceguard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install with PostgreSQL driver
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements-postgres.txt
          .venv/bin/pip install pytest httpx
      - name: PostgreSQL parity tests
        run: .venv/bin/pytest -q tests/integration/test_postgres_parity.py
      - name: Note on migration on fresh database
        run: |
          echo "fresh schema + migrations verified by Database.create_schema() in the test above"

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: npm audit (high/critical 阻断)
        working-directory: apps/web
        run: |
          npm ci
          npm audit --json > audit.json || true
          node -e '
            const a = require("./audit.json");
            const v = a.metadata?.vulnerabilities || {};
            const high = (v.high || 0) + (v.critical || 0);
            console.log(JSON.stringify(v));
            if (high > 0) { console.error("HIGH/CRITICAL vulnerabilities: " + high); process.exit(1); }
          '
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Secret pattern scan
        run: |
          if grep -rInE "(sk-[A-Za-z0-9]{20,}|DEEPSEEK_API_KEY=[^[:space:]]+)" \
              --include="*.py" --include="*.ts" --include="*.vue" --include="*.yml" --include="*.md" .; then
            echo "potential secret pattern found"; exit 1
          else
            echo "no secret pattern found"
          fi

  llm-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      TG_LLM_PROVIDER: deepseek
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt
          .venv/bin/pip install pytest
      - name: Record BLOCKED (no credentials)
        if: ${{ env.DEEPSEEK_API_KEY == '' }}
        run: |
          echo "BLOCKED: DEEPSEEK_API_KEY 未配置，真实 LLM 夜间测试未执行（不得记为通过）"
      - name: LLM connectivity smoke (bounded budget)
        if: ${{ env.DEEPSEEK_API_KEY != '' }}
        run: |
          .venv/bin/python scripts/llm_smoke.py || echo "BLOCKED: LLM smoke failed; recorded, not disguised as pass"
