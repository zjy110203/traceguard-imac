# Nightly Gate（三级门禁之二）：真实依赖（PostgreSQL 16 Service Container）+ 全量测试 + 安全专项。
# 关键失败（PostgreSQL / SSE / Inbox / Worker / 安全）必须阻断后续 Release。
# 真实 LLM 测试只在配置了仓库 Secret 时执行；未配置则显式记录 BLOCKED，不伪装通过。
# 原则：任何"装了但没装成功 / 跑了但失败"的步骤都必须让 Job 真实失败，不用 `|| true`、`|| echo` 掩盖。
name: Nightly Gate

on:
  schedule:
    - cron: "0 18 * * *" # UTC 18:00 = 北京时间次日 02:00
  workflow_dispatch:
  # RUN-017 WP1：工作分支每次推送都以该 HEAD 真实跑一次 Nightly，
  # Release Gate 再按 head_sha 严格匹配，杜绝旧提交的成功结果冒充本轮证据。
  push:
    branches:
      - main
      - "workbuddy/run*"
      - "workbuddy/run*-*"
      - workbuddy/traceguard-autonomous

concurrency:
  group: nightly-gate
  cancel-in-progress: false

jobs:
  backend-full:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # 与 postgres job 同理：内联脚本 / 独立脚本不走 pytest 的 pythonpath。
      PYTHONPATH: packages/core:packages/contracts:packages/execution:packages/agents:packages/evidence:packages/persistence:apps/api:apps/teamflow:apps/workers:benchmark
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m venv .venv
          # RUN-010 WP7：优先按 lock 安装（可复现），失败才回退范围声明
          .venv/bin/pip install -r requirements.lock.txt || \
            .venv/bin/pip install -r requirements-dev.txt
      - name: Install Playwright chromium (must succeed)
        # 不得使用 `|| true`：浏览器装不上时，后续真实浏览器用例会以假跳过/假通过掩盖问题。
        run: |
          .venv/bin/python -m playwright install --with-deps chromium
          .venv/bin/python - <<'PY'
          import pathlib, sys
          roots = [pathlib.Path.home() / ".cache" / "ms-playwright"]
          found = [p.name for r in roots if r.exists() for p in r.iterdir() if "chromium" in p.name]
          if not found:
              print("BLOCKED: playwright chromium 未安装成功（目录为空）", file=sys.stderr)
              sys.exit(1)
          print("playwright chromium installed:", found)
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build frontend (E2E 依赖真实 SPA 产物)
        # RUN-010 收尾缺陷 CL-02：真实浏览器登录用例走单端口 SPA（apps/web/dist），
        # 仓库不含 dist；CI 不构建时 create_app() 不挂载前端路由 → 2 个登录 E2E 必失败
        # （本地因已有 dist 而通过，属于环境依赖未显式化）。构建后 fail-closed 校验产物。
        working-directory: apps/web
        run: |
          npm ci
          npm run build
          test -f dist/index.html || { echo "BLOCKED: 前端 dist 未产出"; exit 1; }
          echo "frontend dist ready: $(ls dist | tr '\n' ' ')"
      - name: Full backend suite (SQLite)
        # RUN-019-R2：CI 曾出现整步挂起（本地 7 分钟、CI 正常 6 分钟），
        # 45 分钟 Job 超时前拿不到任何测试名/栈信息。看门狗在 15 分钟把全部
        # 线程栈写入 Job Summary（可公开读取），35 分钟强制失败退出码 124。
        run: |
          .venv/bin/python scripts/ci_pytest_watchdog.py --timeout 900 --hard-timeout 2100 -- -q
      - name: RUN-016/017 专项（Benchmark v2 / 故障观测 / Regression 重试）
        # 这些用例要么需要真实 Chromium（浏览器观测），要么需要启动独立 TeamFlow 子进程，
        # 因此不进 PR Gate，只在安装好 Chromium 的 Nightly 上跑。
        run: |
          .venv/bin/pytest -q \
            tests/unit/test_benchmark_false_pass_v2_run016.py \
            tests/unit/test_benchmark_fault_effect_run016.py \
            tests/unit/test_fencing_entrypoint_audit_run016.py \
            tests/integration/test_artifact_lifecycle_run016.py \
            tests/integration/test_promotion_recovery_run016.py \
            tests/integration/test_system_config_rbac_run016.py \
            tests/integration/test_regression_retry_run017.py \
            tests/integration/test_fault_effect_teamflow_run017.py \
            tests/integration/test_browser_effect_run017.py
      - name: Worker / event / inbox concurrency (real processes)
        run: |
          .venv/bin/pytest -q \
            tests/unit/test_event_concurrency.py \
            tests/unit/test_inbox_persistence.py \
            tests/unit/test_probe_budget.py \
            tests/integration/test_probe_budget_multiprocess.py \
            tests/integration/test_sandbox_worker_queue.py \
            tests/unit/test_pipeline_state_cache.py
      - name: Upload pytest artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-pytest
          path: |
            .pytest-tmp
            logs
          retention-days: 7

  ui-acceptance:
    # RUN-017 WP6：真实浏览器业务全链路验收（独立 Worker + 真实 Chromium + 真实 TeamFlow）。
    # 独立成 job：这一步最慢（分钟级），不能拖住 backend-full 的 45 分钟上限；
    # 失败必须真实失败（脚本退出码非 0 即阻断），不允许用 `|| true` 掩盖。
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m venv .venv
          # RUN-018 R2：与 backend-full 同口径——优先锁文件安装，失败才回退范围声明。
          # 此前本 job 始终按范围装最新依赖，可能与本地/锁文件验证过的版本漂移
          # （B-28：CI 失败、本地同脚本通过），属可复现性缺口。
          .venv/bin/pip install -r requirements.lock.txt || \
            .venv/bin/pip install -r requirements-dev.txt
      - name: Install Playwright chromium (must succeed)
        run: |
          .venv/bin/python -m playwright install --with-deps chromium
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build frontend
        working-directory: apps/web
        run: |
          npm ci
          npm run build
          test -f dist/index.html
      - name: 真实 UI 全链路业务验收（core profile：业务闭环 + 扩展三段）
        # profile=core 去掉最耗时的独立 Worker 故障段（SIGKILL/租约接管在 2–4 vCPU
        # runner 上容易触发等待超时）；完整故障段在 Reliability Gate（手动）跑。
        # timeout 1500：25 分钟内没跑完就明确失败，不静默挂到 job 超时。
        # RUN-018 WP1：每次 run 使用唯一输出目录（按 GITHUB_RUN_ID），
        # Summary 只读本次报告，不回退仓库中的历史报告。
        env:
          TG_UI_ACCEPTANCE_OUT: docs/assets/run018/ci/${{ github.run_id }}/ui
          TG_UI_ACCEPTANCE_RUN_ID: ${{ github.run_id }}
        run: |
          timeout 1500 .venv/bin/python scripts/business_loop_ui_acceptance_run017.py --profile core
      - name: 汇总 UI 验收结果（写入 Job Summary，便于无凭据环境直接核对）
        if: always()
        env:
          TG_UI_ACCEPTANCE_OUT: docs/assets/run018/ci/${{ github.run_id }}/ui
        run: |
          .venv/bin/python - <<'PY'
          import json, os, pathlib
          # RUN-018 WP1：只读本次 run 专属目录，绝不回退到 docs/assets/run017/wp5/ui 等历史证据。
          out_dir = pathlib.Path(os.environ["TG_UI_ACCEPTANCE_OUT"])
          files = sorted(out_dir.glob("run017-ui-*.json"))
          if not files:
              text = "\n".join(
                  [
                      "### UI 全链路验收结果",
                      "",
                      "- **NOT_PRODUCED**：本次运行没有产出任何 UI 验收报告。",
                      f"- 期望目录：`{out_dir}`",
                      "- 不允许回退读取历史报告（RUN-018 WP1 口径）。",
                      "",
                  ]
              )
              print(text)
              summary = os.environ.get("GITHUB_STEP_SUMMARY")
              if summary:
                  pathlib.Path(summary).write_text(text, encoding="utf-8")
              raise SystemExit(0)
          data = json.loads(files[-1].read_text(encoding="utf-8"))
          rows = ["| check | status | detail |", "|---|---|---|"]
          for item in data.get("results", []):
              rows.append(
                  f"| {str(item.get('check'))[:70]} | {item.get('status')} | "
                  f"{str(item.get('detail'))[:90]} |"
              )
          notes = [r for r in data.get("results", []) if r.get("status") == "NOTE"]
          text = "\n".join(
              [
                  "### UI 全链路验收结果",
                  "",
                  f"- run_id: `{data.get('run_id') or os.environ.get('GITHUB_RUN_ID', '')}`",
                  f"- profile: `{data.get('profile') or 'unspecified'}`",
                  f"- HEAD: `{data.get('git_head') or 'unknown'}`",
                  f"- total: {data.get('total')}",
                  f"- PASS: {data.get('passed')}",
                  f"- FAIL: {data.get('failed')}",
                  f"- NOTE: {len(notes)}",
                  "",
                  *rows,
              ]
          )
          print(text)
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              pathlib.Path(summary).write_text(text, encoding="utf-8")
          PY
      - name: Upload UI evidence（本次 run 专属目录：报告 + 截图 + Worker 日志）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-acceptance-evidence-${{ github.run_id }}
          path: docs/assets/run018/ci/${{ github.run_id }}/ui
          retention-days: 14
          if-no-files-found: warn

  postgres:
    # WP4-01：PostgreSQL 16 Service Container 上的扩展验证（不只是"能连上"）。
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: traceguard
          POSTGRES_PASSWORD: traceguard_ci_only
          POSTGRES_DB: traceguard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U traceguard"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TG_TEST_POSTGRES_URL: postgresql+psycopg://traceguard:traceguard_ci_only@127.0.0.1:5432/traceguard
      # pytest 靠 pyproject 的 pythonpath 注入本地包；内联 `python - <<'PY'` 没有该机制，
      # 必须显式给出，否则 ModuleNotFoundError: traceguard_persistence。
      PYTHONPATH: packages/core:packages/contracts:packages/execution:packages/agents:packages/evidence:packages/persistence:apps/api:apps/teamflow:apps/workers:benchmark
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install with PostgreSQL driver
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements-postgres.txt
          .venv/bin/pip install pytest httpx
      - name: PostgreSQL server version must be 16
        run: |
          .venv/bin/python - <<'PY'
          import os, sys
          from sqlalchemy import create_engine, text
          engine = create_engine(os.environ["TG_TEST_POSTGRES_URL"])
          with engine.connect() as conn:
              v = conn.execute(text("SHOW server_version")).scalar_one()
          print("server_version =", v)
          if not str(v).startswith("16"):
              sys.exit(f"BLOCKED: 期望 PostgreSQL 16，实际 {v}")
          PY
      - name: PostgreSQL parity tests (stores)
        run: .venv/bin/pytest -q tests/integration/test_postgres_parity.py
      - name: PostgreSQL platform tests (migrations v8 / lease fencing / CAS / receipts)
        # 覆盖：迁移 v8 幂等 + 并发启动、claim 原子性、租约接管代次、旧代次提交拒绝、
        #       晋升 CAS 单赢家 + 幂等回执、生产方序列不重号。
        run: .venv/bin/pytest -q tests/integration/test_postgres_platform.py -rs
      - name: PostgreSQL workspace isolation, audit chain and review CAS (RUN-012 WP1)
        # 覆盖：双 Workspace 数据查询与权限过滤、审计链完整性、审核修订号 CAS。
        run: .venv/bin/pytest -q tests/integration/test_postgres_workspace_run012.py -rs
      - name: PostgreSQL 16 lease-fencing lock-wait (RUN-015 WP1)
        # 覆盖：等锁期间租约过期不得复活；原子 submit_result；并发接管单 owner。
        run: .venv/bin/pytest -q tests/integration/test_fencing_pg_run015.py -rs
      - name: PostgreSQL 16 fenced_session 重入与审计（RUN-017 WP4.1）
        run: |
          .venv/bin/pytest -q \
            tests/integration/test_fenced_reentry_run017.py \
            tests/integration/test_fencing_audit_run016.py -rs
      - name: PostgreSQL 16 fencing contract verification script (RUN-014/015)
        # 可自动复核的 PG16 fencing 专项；脚本支持 TG_TEST_POSTGRES_URL。
        env:
          TG_FENCE_PG_DB: traceguard_run015_fence_ci
        run: .venv/bin/python scripts/verify_fencing_pg_run014.py
      - name: Migration idempotency on a fresh PostgreSQL database
        run: |
          .venv/bin/python - <<'PY'
          import os, uuid
          from sqlalchemy import create_engine, text
          from sqlalchemy.engine import make_url
          from traceguard_persistence import Database
          from traceguard_persistence.db import MIGRATIONS

          base = make_url(os.environ["TG_TEST_POSTGRES_URL"])
          name = f"tg_mig_{uuid.uuid4().hex[:8]}"
          admin = create_engine(base.set(database="postgres"), isolation_level="AUTOCOMMIT")
          with admin.connect() as c:
              c.execute(text(f'CREATE DATABASE "{name}"'))
          # 注意：str(URL) 默认 hide_password=True，会渲染成 `***`，连接必然认证失败。
          url = base.set(database=name).render_as_string(hide_password=False)
          try:
              db = Database(url); db.create_schema(); db.create_schema()
              db.dispose()
              db2 = Database(url); db2.create_schema()
              with db2.session() as s:
                  rows = [(int(r[0]), str(r[1])) for r in s.execute(text("SELECT version, name FROM tg_schema_migration")).all()]
              expected = {v for v, _n, _m in MIGRATIONS}
              got = [v for v, _n in rows]
              assert sorted(got) == sorted(expected), (got, sorted(expected))
              assert len(got) == len(set(got)), f"迁移被重复应用: {got}"
              assert (8, "promotion_receipts") in rows
              print("fresh PostgreSQL migration OK:", rows)
              db2.dispose()
          finally:
              with admin.connect() as c:
                  c.execute(text(f'DROP DATABASE IF EXISTS "{name}" WITH (FORCE)'))
              admin.dispose()
          PY

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: npm audit (区分工具错误与漏洞；High/Critical 阻断)
        working-directory: apps/web
        run: |
          npm ci
          set +e
          npm audit --json > audit.json 2> audit.stderr
          audit_code=$?
          set -e
          node - <<'JS'
          const fs = require("fs");
          let raw;
          try {
            raw = fs.readFileSync("audit.json", "utf8");
          } catch (e) {
            console.error("AUDIT_TOOL_ERROR: npm audit 未产出 JSON 报告（无法证明无高危漏洞）");
            process.exit(1);
          }
          let a;
          try {
            a = JSON.parse(raw);
          } catch (e) {
            console.error("AUDIT_TOOL_ERROR: npm audit 报告不是合法 JSON（工具/网络故障），不能当作通过");
            console.error(raw.slice(0, 400));
            process.exit(1);
          }
          if (!a.metadata || !a.metadata.vulnerabilities) {
            console.error("AUDIT_TOOL_ERROR: 报告缺少 metadata.vulnerabilities（审计未真正完成）");
            process.exit(1);
          }
          const v = a.metadata.vulnerabilities;
          const high = (v.high || 0) + (v.critical || 0);
          console.log("audit vulnerabilities =", JSON.stringify(v));
          if (high > 0) {
            console.error(`VULNERABILITIES: HIGH/CRITICAL = ${high}（阻断）`);
            process.exit(1);
          }
          console.log("audit OK: no high/critical vulnerabilities");
          JS
          if [ "$audit_code" -ne 0 ] && [ "$audit_code" -ne 1 ]; then
            echo "AUDIT_TOOL_ERROR: npm audit 退出码 $audit_code（非'发现漏洞'的 1）"; exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Secret pattern scan
        # 只匹配"真实密钥形态"。占位符（如文档里的 `DEEPSEEK_API_KEY=…`）不得误报：
        # 有误报的门禁会被人习惯性绕过，等于没有门禁（这正是本轮要修的"掩盖"问题）。
        # 用 `git grep` 而非 `grep -r`：只扫已跟踪文件，天然排除 .venv / node_modules / 本地运行态。
        run: |
          set -euo pipefail
          pattern='(sk-[A-Za-z0-9]{20,}|DEEPSEEK_API_KEY=[A-Za-z0-9_-]{16,}|github_pat_[A-Za-z0-9_]{20,}|ghp_[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|BEGIN (RSA|OPENSSH|EC) PRIVATE KEY)'
          if git grep -InE "$pattern" -- '*.py' '*.ts' '*.vue' '*.yml' '*.yaml' '*.md' '*.json' '*.sh' ':!/\.github'; then
            echo "SECRET_PATTERN_FOUND"
            exit 1
          fi
          echo "no secret pattern found"

  llm-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      TG_LLM_PROVIDER: deepseek
    outputs:
      llm_status: ${{ steps.llm.outputs.status }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt
          .venv/bin/pip install pytest
      - name: LLM smoke (真实调用；缺 Secret 记 BLOCKED，有 Secret 失败即失败)
        id: llm
        run: |
          if [ -z "${DEEPSEEK_API_KEY:-}" ]; then
            echo "status=BLOCKED" >> "$GITHUB_OUTPUT"
            printf '{"status":"BLOCKED","reason":"DEEPSEEK_API_KEY 未配置","real_llm_executed":false}\n' > llm-status.json
            {
              echo "### LLM Smoke: BLOCKED"
              echo "DEEPSEEK_API_KEY 未配置，真实 LLM 夜间测试未执行。"
              echo "**不得记为通过**，Release Gate 会据此判定证据缺失。"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "BLOCKED: DEEPSEEK_API_KEY 未配置，真实 LLM 夜间测试未执行（不得记为通过）"
            exit 0
          fi
          # 有凭据：真实执行，失败必须真实失败（不吞异常、不降级为"通过"）
          .venv/bin/python scripts/llm_smoke.py
          echo "status=PASSED" >> "$GITHUB_OUTPUT"
          printf '{"status":"PASSED","reason":"","real_llm_executed":true}\n' > llm-status.json
          echo "### LLM Smoke: PASSED" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload LLM status attestation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: llm-smoke-status
          path: llm-status.json
          retention-days: 30
          if-no-files-found: error

  gate-verdict:
    # 汇总门禁结论：任一关键 Job 失败即失败；LLM 缺凭据显式标 BLOCKED（不算通过）。
    needs: [backend-full, postgres, security, llm-smoke, ui-acceptance]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Summarize and enforce
        run: |
          llm_status="${{ needs.llm-smoke.outputs.llm_status }}"
          # RUN-016 WP5：把"Job 执行成功"与"真实 LLM 测试是否执行"分开写清楚，
          # 不再用一行 `success / BLOCKED` 混合表述掩盖证据缺失。
          case "$llm_status" in
            PASSED) llm_text="真实 LLM 测试已执行并通过" ;;
            BLOCKED) llm_text="Job 正常结束，但真实 LLM 测试**未执行**（缺 Secret）" ;;
            *) llm_text="真实 LLM 测试状态未知：$llm_status" ;;
          esac
          {
            echo "### Nightly Gate 结论（commit ${{ github.sha }}）"
            echo ""
            echo "| Job | Job 结果 | 真实测试证据 |"
            echo "| --- | --- | --- |"
            echo "| backend-full | ${{ needs.backend-full.result }} | 全量 pytest |"
            echo "| postgres (PG16) | ${{ needs.postgres.result }} | PG16 专项 |"
            echo "| security | ${{ needs.security.result }} | 供应链/密钥扫描 |"
            echo "| llm-smoke | ${{ needs.llm-smoke.result }} | $llm_status |"
            echo "| ui-acceptance | ${{ needs.ui-acceptance.result }} | 真实浏览器业务全链路 |"
            echo ""
            echo "LLM 证据口径：$llm_text"
            if [ "$llm_status" != "PASSED" ]; then
              echo ""
              echo "> 本次 Nightly **不能**作为 Release 的 LLM 证据；Release Gate 会下载 \`llm-smoke-status\` 工件并要求 PASSED。"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          failed=0
          for r in "${{ needs.backend-full.result }}" "${{ needs.postgres.result }}" "${{ needs.security.result }}" "${{ needs.ui-acceptance.result }}"; do
            if [ "$r" != "success" ]; then failed=1; fi
          done
          if [ "${{ needs.llm-smoke.result }}" != "success" ]; then
            echo "LLM smoke 真实失败（有凭据时不允许掩盖）"; failed=1
          fi
          if [ "$llm_status" = "BLOCKED" ]; then
            echo "::warning::LLM smoke BLOCKED（缺 Secret）；该证据不得用于 Release 放行"
          fi
          if [ "$llm_status" = "" ]; then
            echo "::error::LLM smoke 未产出状态，视为证据缺失"
            failed=1
          fi
          exit $failed
